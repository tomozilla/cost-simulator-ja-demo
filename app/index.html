<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cost simulator (sample)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f8; color: #1c1c1c; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: #555; font-size: 14px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 10px; padding: 16px; }
  label { display: block; font-size: 13px; margin: 8px 0 2px; }
  input, select { width: 100%; box-sizing: border-box; padding: 5px 7px; font-size: 14px; }
  .row { display: flex; gap: 8px; margin: 10px 0 4px; flex-wrap: wrap; }
  button { padding: 5px 10px; font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
  th, td { padding: 4px 6px; border-bottom: 1px solid #eee; text-align: right; }
  th:first-child, td:first-child { text-align: left; }
  .tot { display: flex; gap: 12px; margin: 8px 0 12px; flex-wrap: wrap; }
  .box { flex: 1; min-width: 200px; border: 1px solid #ddd; border-radius: 8px; padding: 10px; }
  .box b { font-size: 22px; display: block; }
  .on { background: #e8f5e9; border-color: #a5d6a7; }
  .off { background: #fff4e5; border-color: #f0c27b; }
  .over { color: #b3261e; font-weight: 600; }
  .warn { background: #fff4e5; border: 1px solid #f0c27b; padding: 8px 10px; border-radius: 6px; font-size: 13px; margin-bottom: 10px; }
  .err { background: #fdecea; border-color: #e5a29b; }
  .foot { font-size: 12px; color: #666; margin-top: 10px; }
</style>
</head>
<body>
<main>
  <h1>Cost simulator (sample)</h1>
  <div class="sub">Enter a month of usage. See the bill with the spend cap ON and OFF, and which items the cap does not cover. An estimate, not a quote.</div>
  <div id="banner"></div>
  <div class="grid">
    <form class="card" id="form" autocomplete="off">
      <label for="plan">Plan</label>
      <select id="plan"><option value="pro">Pro</option><option value="team">Team</option></select>
      <label for="projects">Running projects</label><input id="projects" type="number" min="1" max="50" value="1">
      <label for="compute">Compute size (each)</label>
      <select id="compute"><option>micro</option><option>small</option><option>medium</option><option>large</option><option>xl</option></select>
      <label for="pitr">Projects with PITR add-on</label><input id="pitr" type="number" min="0" value="0">
      <label for="domains">Custom domains</label><input id="domains" type="number" min="0" value="0">
      <hr>
      <label for="egressGb">Egress (GB)</label><input id="egressGb" type="number" min="0" step="1" value="50">
      <label for="cachedGb">Cached egress (GB)</label><input id="cachedGb" type="number" min="0" step="1" value="20">
      <label for="storageGb">File storage (GB)</label><input id="storageGb" type="number" min="0" step="1" value="10">
      <label for="dbGb">Database size (GB, all projects)</label><input id="dbGb" type="number" min="0" step="0.1" value="1">
      <label for="mau">Monthly active users</label><input id="mau" type="number" min="0" step="100" value="2000">
      <label for="rtMessagesM">Realtime messages (millions)</label><input id="rtMessagesM" type="number" min="0" step="0.1" value="0.5">
      <label for="rtPeak">Realtime peak connections</label><input id="rtPeak" type="number" min="0" step="10" value="50">
      <label for="edgeM">Edge Function invocations (millions)</label><input id="edgeM" type="number" min="0" step="0.1" value="0.2">
      <div class="row"><button type="button" id="spike">What if traffic x10?</button><button type="button" id="reset">Reset</button></div>
    </form>
    <section class="card" id="result" aria-live="polite"></section>
  </div>
  <div class="foot" id="foot"></div>
</main>
<script src="sim.js"></script>
<script src="app.js"></script>
</body>
</html>
